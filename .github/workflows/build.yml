# Builds Heft on every push to main and on pull requests, validates it with
# pluginval (strictness 10), runs HeftMeasure and uploads Heft.vst3 as an artifact.
# Pushing a version tag (e.g. v0.4.2) also creates a *draft* GitHub Release with the zipped
# plugin. Nobody sees a draft until it's published by hand on GitHub, after downloading
# its zip and testing it (README, "Publishing a new version").
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Build, validate and measure
        shell: powershell
        run: ./build.ps1 -Measure -InstallDir "$env:RUNNER_TEMP\VST3"

      - name: Upload Heft.vst3
        uses: actions/upload-artifact@v7
        with:
          name: Heft-VST3-Windows-x64
          path: |
            build/Heft_artefacts/Release/VST3/
            !build/Heft_artefacts/Release/VST3/*.lib
            !build/Heft_artefacts/Release/VST3/*.exp
          if-no-files-found: error

  release:
    name: Draft release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches VERSION in CMakeLists.txt
        run: |
          version=$(sed -n 's/^project(Heft VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: Heft-VST3-Windows-x64
          path: dist

      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="Heft-$GITHUB_REF_NAME-Windows-x64.zip"
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/
          (cd dist && zip -r "../$zip_name" Heft.vst3 LICENSE THIRD_PARTY_NOTICES.txt)

          cat > notes.md <<'EOF'
          VST3 plugin for Windows x64, validated with pluginval (strictness 10).

          ## Install
          1. Download the `.zip` below and unzip it.
          2. Copy the `Heft.vst3` folder into a folder your DAW scans for VST3 plugins,
             e.g. `C:\Program Files\Common Files\VST3` (needs admin) or `%USERPROFILE%\VST3`.
          3. Rescan plugins in your DAW (REAPER: Options → Preferences → Plug-ins → VST → Re-scan).

          The plugin is not code-signed. Licensed under the GNU AGPL v3; the source code is in this repository.
          Third-party licences are in THIRD_PARTY_NOTICES.txt inside the zip.
          EOF

          # --draft: published by hand after testing the zip.
          gh release create "$GITHUB_REF_NAME" "$zip_name" --draft --verify-tag --title "Heft $GITHUB_REF_NAME" --notes-file notes.md
