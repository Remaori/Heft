# Builds Heft on every push to main and on pull requests, validates it with
# pluginval (strictness 10), runs HeftMeasure and uploads Heft.vst3 as an artifact.
# Sonolint then measures how it sounds against sonolint/baseline.json and comments on
# the pull request, also when pluginval or HeftMeasure failed. Running this workflow by
# hand makes a new baseline instead.
# Pushing a version tag (e.g. v0.4.2) also creates a *draft* GitHub Release with the zipped
# plugin. Nobody sees a draft until it's published by hand on GitHub, after downloading
# its zip and testing it (docs/RELEASING.md).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      vst3_built: ${{ steps.upload.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v7

      - name: Build, validate and measure
        shell: powershell
        run: ./build.ps1 -Measure -InstallDir "$env:RUNNER_TEMP\VST3"

      # Also when pluginval or HeftMeasure failed, so Sonolint can still report; not
      # when Heft didn't build.
      - name: Upload Heft.vst3
        id: upload
        if: ${{ !cancelled() && hashFiles('build/Heft_artefacts/Release/VST3/Heft.vst3/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Heft-VST3-Windows-x64
          path: |
            build/Heft_artefacts/Release/VST3/
            !build/Heft_artefacts/Release/VST3/*.lib
            !build/Heft_artefacts/Release/VST3/*.exp
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-26   # fixed: with macos-latest, a new Xcode would arrive unannounced
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Check that Rosetta is there, to test the Intel code
        run: arch -x86_64 /usr/bin/true

      - name: Build, validate and measure
        run: ./build.sh --measure --install-dir "$RUNNER_TEMP/VST3"

      # Zipped here with ditto: uploaded loose, the bundles could lose permissions and their
      # signatures with them. build.sh installed the AU in the runner's Components folder.
      - name: Zip Heft.vst3 and Heft.component
        run: |
          mkdir "$RUNNER_TEMP/Heft"
          ditto "$RUNNER_TEMP/VST3/Heft.vst3" "$RUNNER_TEMP/Heft/Heft.vst3"
          ditto "$HOME/Library/Audio/Plug-Ins/Components/Heft.component" "$RUNNER_TEMP/Heft/Heft.component"
          ditto -c -k --keepParent "$RUNNER_TEMP/Heft" Heft-macOS-Universal.zip

      - name: Upload the plugins
        uses: actions/upload-artifact@v7
        with:
          name: Heft-macOS-Universal
          path: Heft-macOS-Universal.zip
          if-no-files-found: error

  sonolint:
    name: Sonolint
    needs: windows
    if: ${{ !cancelled() && needs.windows.outputs.vst3_built == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Heft-VST3-Windows-x64
          path: build/vst3

      - uses: Remaori/Sonolint@v0.1.0-rc.1
        with:
          plugin: build/vst3/Heft.vst3

  # Run by hand (Actions > Build > Run workflow) after an intended change of sound: the
  # new baseline is baseline.json in the artifact of the run, to download and commit as
  # sonolint/baseline.json. Same runner as the comparison above.
  sonolint-baseline:
    name: Sonolint baseline
    needs: windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Heft-VST3-Windows-x64
          path: build/vst3

      - uses: Remaori/Sonolint@v0.1.0-rc.1
        with:
          plugin: build/vst3/Heft.vst3
          mode: baseline

  release:
    name: Draft release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches VERSION in CMakeLists.txt
        run: |
          version=$(sed -n 's/^project(Heft VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in CMakeLists.txt"
            exit 1
          fi

      # The release notes are this version's section of CHANGELOG.md: from "## 0.4.2"
      # (a date or note after a space is fine) to the next "## " heading. No section,
      # no release: a version never goes out without notes.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found && NF == 0 && ! started { next }   # blank lines before the text
            found { started = 1; lines[++n] = $0 }
            END {
              while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--   # and after it
              for (i = 1; i <= n; i++) print lines[i]
            }
          ' CHANGELOG.md > changes.md

          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::Add a '## $version' section to CHANGELOG.md"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: Heft-VST3-Windows-x64
          path: dist

      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_name="Heft-$GITHUB_REF_NAME-Windows-x64.zip"
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/
          (cd dist && zip -r "../$zip_name" Heft.vst3 LICENSE THIRD_PARTY_NOTICES.txt)

          cat > install.md <<'EOF'
          VST3 plugin for Windows x64, validated with pluginval (strictness 10).

          ## Install
          1. Download the `.zip` below and unzip it.
          2. Copy the `Heft.vst3` folder into a folder your DAW scans for VST3 plugins,
             e.g. `C:\Program Files\Common Files\VST3` (needs admin) or `%USERPROFILE%\VST3`.
          3. Rescan plugins in your DAW (REAPER: Options → Preferences → Plug-ins → VST → Re-scan).

          The plugin is not code-signed. Licensed under the GNU AGPL v3; the source code is in this repository.
          Third-party licences are in THIRD_PARTY_NOTICES.txt inside the zip.
          EOF

          { echo "## What's new"; echo; cat changes.md; echo; cat install.md; } > notes.md

          # --draft: published by hand after testing the zip.
          gh release create "$GITHUB_REF_NAME" "$zip_name" --draft --verify-tag --title "Heft $GITHUB_REF_NAME" --notes-file notes.md
